name: shaders

# Compiles the Metal and HLSL shaders with Apple's and Microsoft's own compilers, which only run
# on their systems. Linux contributors cannot check them locally. The WGSL shaders are validated
# by the gpui_wgpu tests instead.
on:
  pull_request:
    paths:
      - "crates/gpui/src/scene.rs"
      - "crates/gpui_apple/**"
      - "crates/gpui_windows/**"
  workflow_dispatch:

jobs:
  metal:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The build script generates the scene header and compiles shaders.metal with xcrun.
      - run: cargo check --package gpui_apple

  hlsl:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: Swatinem/rust-cache@v2
      # The build script compiles shaders.hlsl with fxc from the Windows SDK.
      - run: cargo check --package gpui_windows
